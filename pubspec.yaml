name: ai_lesson_planner
description: Offline AI Lesson Plan Assistant for DepEd teachers
publish_to: "none" # This is a private project

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.0
  riverpod: ^2.4.0
  
  # Database & Local Storage
  drift: ^2.13.0
  sqlite3_flutter_libs: ^0.5.10
  path_provider: ^2.1.0
  path: ^1.8.0
  
  # File Operations & Export
  archive: ^4.0.2
  pdf: ^3.13.1
  docs_gee: ^1.5.0
  # File import/export
  file_picker: ^12.0.0

  # LLM Engine (on-device inference)
  llamadart: 0.21.0

  # Model Download & Verification
  http: ^1.1.0
  crypto: ^3.0.0
  
  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.3
  json_annotation: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  drift_dev: ^2.13.0
  test: ^1.31.1

flutter:
  uses-material-design: true

  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700

  assets:
    - assets/